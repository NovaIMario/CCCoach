{% extends "base.html" %}
{% block title %}Problems · CCCoach{% endblock %}
{% block content %}
<h1>Problems</h1>
<div class="card form search">
  <select id="platform">
    <option value="cf">Codeforces</option>
    <option value="lc">LeetCode</option>
  </select>
  <div class="field">
    <input id="name" placeholder="Problem name" autocomplete="off">
    <div id="name-dropdown" class="dropdown"></div>
  </div>
  <select id="tag">
    <option value="">Any tag</option>
    {% for t in tags %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
  </select>
  <input id="min" type="number" step="100" placeholder="Min rating" title="Codeforces scale (LeetCode ratings are converted)">
  <input id="max" type="number" step="100" placeholder="Max rating" title="Codeforces scale (LeetCode ratings are converted)">
  <button id="go">Search</button>
</div>
<p id="count" class="muted"></p>
<div id="results" class="cards"></div>
<nav class="pager" aria-label="Result pages"><button id="prev" class="secondary">&lsaquo; Prev</button><span id="pages" class="pages"></span><button id="next" class="secondary">Next &rsaquo;</button></nav>
{% endblock %}
{% block scripts %}
<script>const NAMES = {{ names|tojson }};</script>
<script src="/static/trie.js?v={{ v }}"></script>
<script src="/static/problems.js?v={{ v }}"></script>
{% endblock %}
