name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Unit + API tests use fake Codeforces/LeetCode/Gemini clients, so no secrets or network needed.
      - run: pytest -q
        env:
          CPCOACH_OFFLINE: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cpcoach .
      # Smoke test: boot the real image (it downloads the problemset from Codeforces) and hit /health.
      - run: |
          docker run -d -p 8000:8000 --name app cpcoach
          for i in $(seq 1 60); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs app; exit 1
